<svg width="1200" height="520" viewBox="0 0 1200 520" fill="none" xmlns="http://www.w3.org/2000/svg">
  <title>ProxySentry — macOS 节点故障切换守卫</title>
  <rect width="1200" height="520" rx="32" fill="#F6F1E7"/>
  <path d="M0 400C174 339 319 461 503 406C695 349 838 327 1200 409V520H0V400Z" fill="#C8FF57"/>
  <circle cx="64" cy="58" r="12" fill="#FF5A47"/>
  <circle cx="96" cy="58" r="12" fill="#1D5CFF"/>
  <circle cx="128" cy="58" r="12" fill="#111111"/>

  <text x="62" y="125" fill="#111111" font-family="Arial, PingFang SC, sans-serif" font-size="20" font-weight="700" letter-spacing="3">MACOS / AUTO FAILOVER</text>
  <text x="58" y="235" fill="#111111" font-family="Arial Black, Arial, PingFang SC, sans-serif" font-size="78" font-weight="900">Proxy</text>
  <text x="288" y="235" fill="#1D5CFF" font-family="Arial Black, Arial, PingFang SC, sans-serif" font-size="78" font-weight="900">Sentry</text>
