  <text x="62" y="353" fill="#414141" font-family="Arial, PingFang SC, sans-serif" font-size="23" font-weight="500">延迟只是线索，真实吞吐才是答案。</text>

  <g>
    <rect x="792" y="72" width="340" height="139" rx="22" fill="#1D5CFF"/>
    <text x="820" y="120" fill="#DDE7FF" font-family="Arial, PingFang SC, sans-serif" font-size="20" font-weight="700">延迟看起来很健康</text>
    <text x="820" y="184" fill="white" font-family="Arial Black, Arial, sans-serif" font-size="66" font-weight="900">121 ms</text>
  </g>
  <g>
    <rect x="792" y="231" width="340" height="137" rx="22" fill="#FF5A47"/>
    <text x="820" y="279" fill="#FFE6E1" font-family="Arial, PingFang SC, sans-serif" font-size="20" font-weight="700">实际下载只剩</text>
    <text x="820" y="341" fill="white" font-family="Arial Black, Arial, sans-serif" font-size="66" font-weight="900">1 B/s</text>
  </g>

  <path d="M720 141C758 151 768 177 777 202" stroke="#111111" stroke-width="7" stroke-linecap="round" stroke-dasharray="2 18"/>
  <path d="M764 192L779 211L789 190" stroke="#111111" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>

  <g transform="translate(60 431)">
